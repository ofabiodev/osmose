syntax = "proto3";

package osmium.client.billing;

// billing.requestPaymentLink -> billing.PaymentLink
message RequestPaymentLink {
  string redirect_url = 1;
  string plan = 2;
  string billing_period = 3; // monthly or yearly
}

message PaymentLink {
  optional string url = 1;
}

// billing.getProducts -> billing.Products
message GetProducts {}

message Products {
  repeated Product products = 1;
  repeated CreditOffer credit_offers = 2;
}

message Product {
  string plan = 1;
  string name = 2;
  repeated ProductPrice prices = 3;
}

message ProductPrice {
  string billing_period = 1; // monthly, yearly, or lifetime
  uint64 amount_minor = 2;
  string currency = 3;
}

message CreditOffer {
  string id = 1;
  string product_id = 2;
  optional uint32 duration_days = 3; // absent means lifetime
  uint64 amount_minor = 4;
  string currency = 5;
}

// billing.cancelSubscription -> billing.CancelSubscription
message CancelSubscription {}

// billing.getSubscription -> billing.Subscription
message GetSubscription {}

message Subscription {
  bool active = 1;
  optional fixed64 since = 2;
  optional uint64 next_renewal_date = 3;
  optional string last_card_digits = 4;
  optional string method = 5; // e.g. directdebit, paypal
  optional uint64 end_date = 6;
}

// billing.purchaseCredit -> billing.PaymentLink
// One-time payment that puts a redeemable credit into the buyer's inventory.
message PurchaseCredit {
  string redirect_url = 1;
  string plan = 2 [deprecated = true];
  string billing_period = 3 [deprecated = true];
  string offer_id = 4;
}

// billing.getInventory -> billing.InventoryList
message GetInventory {}

message InventoryItem {
  // @snowflake<InventoryItem>
  fixed64 id = 1;
  string product_id = 2; // early_supporter
  string billing_period = 3; // monthly, yearly, lifetime
  uint64 created_at = 4;
  optional uint64 redeemed_at = 5;
  optional string gift_code = 6; // active gift link, if any
  optional uint64 gift_expires_at = 7;
  optional uint32 duration_days = 8; // absent means lifetime
  bool active = 9; // currently contributing an entitlement
}

message InventoryList {
  repeated InventoryItem items = 1;
}

// billing.redeemInventoryItem -> ()
// Redeems one of your own inventory items, stacking the time after any
// benefits you already have.
message RedeemInventoryItem {
  // @snowflake<InventoryItem>
  fixed64 item_id = 1;
}

// billing.createGiftLink -> billing.GiftLink
message CreateGiftLink {
  // @snowflake<InventoryItem>
  fixed64 item_id = 1;
}

message GiftLink {
  string gift_code = 1;
  uint64 expires_at = 2;
}

// billing.revokeGiftLink -> ()
message RevokeGiftLink {
  // @snowflake<InventoryItem>
  fixed64 item_id = 1;
}

// billing.claimGift -> billing.ClaimedGift
message ClaimGift {
  string gift_code = 1;
}

message ClaimedGift {
  string product_id = 1;
  string billing_period = 2 [deprecated = true];
  optional uint32 duration_days = 3; // absent means lifetime
}
