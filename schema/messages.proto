syntax = "proto3";

package osmium.client.messages;

import "types.proto";
import "refs.proto";
import "media.proto";
import "reactions.proto";

// messages.sendMessage -> messages.SentMessage
message SendMessage {
  message ReplyTo {
    message Quote {
      string message = 1;
      repeated types.MessageEntity entities = 2;
      optional uint64 offset = 3;
    }
    // @snowflake<Message>
    fixed64 message_id = 1;
    optional Quote quote = 2;
  }

  message BotInfo {
    message MessageCloak {
      string name = 1;
      // @snowflake<File>
      optional fixed64 photo_id = 2;
    }
    message Buttons {
      message ButtonRow {
        repeated MessageButton buttons = 1;
      }
      repeated ButtonRow rows = 1; // max of 5 rows, max of 5 per row
    }
    optional MessageCloak cloak = 1;
    optional Buttons buttons = 2;
  }

  refs.ChatRef chat_ref = 1;
  string message = 2;
  // @snowflake<Message>
  optional fixed64 reply_to_old = 3 [deprecated = true];
  repeated media.MediaRef media = 4;
  repeated types.MessageEntity entities = 5;
  bool suppress_embeds = 6;
  optional ReplyTo reply_to = 7;
  optional BotInfo bot_info = 8;
  optional fixed64 client_id = 9;
}

message MessageButton {
  message MessageButtonUrl {
    string url = 1;
  }
  message MessageButtonInteraction {
    string data = 1;
  }
  message MessageButtonClipboard {
    string text = 1;
  }

  string label = 1;
  oneof action {
    MessageButtonUrl url = 2;
    MessageButtonInteraction interaction = 3;
    MessageButtonClipboard clipboard = 4;
  }
}

message SentMessage {
  // @snowflake<Message>
  fixed64 message_id = 1;
}

// messages.submitInteraction -> messages.InteractionResponse
message SubmitInteraction {
  refs.ChatRef chat_ref = 1;
  // @snowflake<Message>
  fixed64 message_id = 2;
  optional string data = 3;
}

message InteractionResponse {
  optional string message = 1;
}

// messages.editMessage -> ()
message EditMessage {
  refs.ChatRef chat_ref = 1;
  // @snowflake<Message>
  fixed64 message_id = 2;
  optional string message = 3;
  bool remove_media = 4;
  // Replaces media
  repeated media.MediaRef media = 5;
  // Replaces entities if not empty or if message is set.
  repeated types.MessageEntity entities = 6;
  bool suppress_embeds = 7;
  optional SendMessage.BotInfo.Buttons buttons = 8;
}

// messages.forwardMessage -> ()
message ForwardMessage {
  refs.ChatRef chat_ref = 1;
  refs.ChatRef from = 2;
  // @snowflake<Message>
  repeated fixed64 message_ids = 3;
}

// messages.deleteMessage -> ()
message DeleteMessage {
  refs.ChatRef chat_ref = 1;
  // @snowflake<Message>
  repeated fixed64 message_ids = 2;
}

// messages.getHistory -> messages.Messages
message GetHistory {
  refs.ChatRef chat_ref = 1;
  // Limit the number of messages to return. Defaults to 50, split when using
  // around.
  optional uint32 limit = 2;
  oneof offset {
    // @snowflake<Message>
    fixed64 since = 3;
    // @snowflake<Message>
    fixed64 before = 4;
    // @snowflake<Message>
    fixed64 around = 5;
  }
}

message Messages {
  repeated types.Message messages = 1;
  repeated types.User users = 2;
  repeated types.CommunityMember members = 3;
  repeated reactions.MessageReactions reactions = 4;
}

// messages.search -> messages.Messages
message Search {
  refs.ChatRef chat_ref = 1;
  string query = 2;
  bool scoped = 3; // A scoped query searches only the specific channel, rather than the entire parent. For global search, see messages.searchAll
  oneof offset {
    // @snowflake<Message>
    fixed64 since = 4;
    // @snowflake<Message>
    fixed64 before = 5;
  }
}

// messages.getEmbedPreview -> media.MediaEmbed
message GetEmbedPreview {
  string message = 1;
  repeated types.MessageEntity entities = 2;
}

// messages.reportMessage -> ()
message ReportMessage {
  // @snowflake<Message>
  fixed64 message_id = 1;
  refs.ChatRef chat_ref = 2;
  string reason = 3;
}

// messages.getUnreadMentions -> messages.UnreadMentions
message GetUnreadMentions {
  refs.ChatRef chat_ref = 1;
}

message UnreadMentions {
  // @snowflake<Message>
  repeated fixed64 message_ids = 1;
}

// messages.setMessagePin -> ()
message SetMessagePin {
  refs.ChatRef chat_ref = 1;
  // @snowflake<Message>
  fixed64 message_id = 2;
  bool pin = 3;
}

// messages.getPinnedMessages -> messages.Messages
message GetPinnedMessages {
  refs.ChatRef chat_ref = 1;
}

// messages.setInteractionResponse -> ()
message SetInteractionResponse {
  // @snowflake<Interaction>
  fixed64 interaction_id = 1;
  optional string message = 2;
}
