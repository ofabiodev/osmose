syntax = "proto3";

package osmium.client.settings;

import "media.proto";
import "refs.proto";
import "types.proto";

// settings.editProfilePhoto -> ()
message EditProfilePhoto { optional media.UploadedFileRef file = 1; }

// settings.editProfileBanner -> ()
message EditProfileBanner { optional media.UploadedFileRef file = 1; }

// settings.registerPushSubscription -> ()
message RegisterPushSubscription {
  enum PushType {
    UNKNOWN = 0;
    WEB = 1;
    IOS = 2;
    ANDROID_FCM = 3;
  }
  enum PushEncryptionScheme {
    PUSH_ENCRYPTION_UNKNOWN = 0;
    P256_HKDF_SHA256_AES256GCM_V1 = 1;
  }
  message WebPush {
    string endpoint = 1;
    string p256dh = 2;
    string auth = 3;
  }
  message Push {
    PushType type = 1;
    string token = 2;
    optional string encryption_public_key = 3;
    optional string encryption_auth_secret = 4;
    optional string encryption_key_id = 5;
    PushEncryptionScheme encryption_scheme = 6;
  }

  oneof subscription {
    WebPush web = 1;
    Push push = 2;
  }
}

// settings.unregisterPushSubscription -> ()
message UnregisterPushSubscription {}

// settings.changeNotificationPreferences -> ()
message ChangeNotificationPreferences {
  types.NotifPrefs prefs = 1;

  oneof scope {
    refs.ChatRef chat_ref = 2; // For channel or DM chat
    // @snowflake<Community>
    fixed64 community_id = 3; // For community-level default
  }
}

// settings.editUserSettings -> settings.UserSettings
message EditUserSettings {
  optional UserSettings settings = 1;
}

message UserSettings {
  message CommunityOrder {
    // @snowflake<Community>
    repeated fixed64 community_ids = 1;
  }
  optional CommunityOrder community_order = 1;

  message EmailPreferences {
    // Transactional emails for missed calls, messages, and friend requests.
    optional bool communication_emails = 1;
    // Promotion emails for update announcements.
    optional bool announcement_emails = 2;
  }
  optional EmailPreferences email_preferences = 2;
}

// settings.editProfile -> ()
message EditProfile {
  optional string name = 1;
  optional string username = 2;
  optional string bio = 3;
  // @snowflake<Emoji>
  optional fixed64 icon = 4;
  optional uint32 color = 5;
  // Packed RGB colors: first color in bits 0-23, second color in bits 24-47.
  optional uint64 theme_color = 6;
  optional bool show_banner_in_voice = 7;
}

// settings.getAccount -> settings.Account
message GetAccount {}

message Account {
  optional string email = 1;
  bool confirmed = 2;
  bool has_password = 3;
  bool totp_enabled = 4;
  bool pending_delete = 5;
}

// settings.changePassword -> ()
message ChangePassword {
  string current_password = 1;
  string new_password = 2;
  bool revoke_sessions = 3; // Revoke all other sessions after password change
}

// settings.changeEmail -> ()
message ChangeEmail {
  string new_email = 1;
}

// settings.changeStatus -> ()
message ChangeStatus {
  osmium.client.types.UserStatus.Status status = 2;
  repeated osmium.client.types.UserStatus.Activity activities = 3;
  optional fixed64 last_active = 4;
}

// settings.setupTotp -> settings.Totp
message SetupTotp {
  bool enabled = 1;
  optional string code = 2;
  optional string step_up_token = 3;
}

message Totp {
  bool enabled = 1;
  optional string url = 2;
  repeated BackupCode backup_codes = 3;
}

message BackupCode {
  string code = 1;
  bool used = 2;
}

// settings.setupWebauthn -> settings.Webauthn
message SetupWebauthn {
  bool enabled = 1;
  optional string credential_json = 2;
  // @snowflake<AccountMfa>
  optional fixed64 credential_id = 3;
  optional string display_name = 4;
  optional string step_up_token = 5;
  optional string challenge_id = 6;
}

message Webauthn {
  optional string options_json = 1;
  optional WebauthnCredential credential = 2;
  repeated BackupCode recovery_codes = 3;
  optional string challenge_id = 4;
}

message WebauthnCredential {
  // @snowflake<AccountMfa>
  fixed64 id = 1;
  string credential_id = 2;
  string display_name = 3;
  fixed64 created_at = 4;
  optional fixed64 last_used_at = 5;
}

// settings.getMfaMethods -> settings.MfaMethods
message GetMfaMethods {}

message MfaMethods {
  bool totp_enabled = 1;
  repeated WebauthnCredential webauthn_credentials = 2;
  uint32 recovery_codes_remaining = 3;
}

// settings.beginMfaStepUp -> settings.MfaStepUp
message BeginMfaStepUp { string password = 1; }

message MfaStepUp {
  optional string step_up_token = 1;
  optional string challenge_id = 2;
  optional fixed64 expires_at = 3;
  bool totp = 4;
  bool recovery_codes = 5;
  optional string webauthn_options_json = 6;
}

// settings.completeMfaStepUp -> settings.MfaStepUp
message CompleteMfaStepUp {
  string challenge_id = 1;
  oneof proof {
    string totp = 2;
    string recovery_code = 3;
    string webauthn_credential_json = 4;
  }
}

// settings.regenerateRecoveryCodes -> settings.RecoveryCodes
message RegenerateRecoveryCodes { string step_up_token = 1; }

// settings.getRecoveryCodes -> settings.RecoveryCodes
message GetRecoveryCodes { string password = 1; }

message RecoveryCodes { repeated BackupCode recovery_codes = 1; }

// settings.requestTakeout -> ()
message RequestTakeout {}

// settings.deleteAccount -> ()
message DeleteAccount {
  optional bool cancel = 1;
}
