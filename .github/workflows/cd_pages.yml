name: "🌐 CD — GitHub Pages"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  cd_build:
    runs-on: ubuntu-latest
    name: 🏗️ Build Pages site
    steps:
      - name: "➕ Actions - Checkout"
        uses: actions/checkout@v6

      - name: "🟢 Actions - Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: "🥟 Actions - Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "💾 Cache Dependencies"
        uses: actions/cache@v5
        with:
          path: ~/.bun
          key: bun-linux-${{ hashFiles('docs/package.json', 'docs/bun.lock') }}
          restore-keys: bun-linux-

      - name: "📦 Installing Dependencies"
        working-directory: docs
        run: bun ci

      - name: "✅ Validate documentation"
        working-directory: docs
        run: bun run docs:check

      - name: "🏗️ Build static docs"
        env:
          DOCSHELF_BASE: "/${{ github.event.repository.name }}"
        working-directory: docs
        run: bun run docs:build

      - name: "⚙️ Configure GitHub Pages"
        uses: actions/configure-pages@v6

      - name: "📤 Upload Pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  cd_deploy:
    runs-on: ubuntu-latest
    needs: cd_build
    name: 🚀 Deploy Pages site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.cd_deployment.outputs.page_url }}
    steps:
      - name: "🚀 Deploy GitHub Pages"
        id: cd_deployment
        uses: actions/deploy-pages@v5
